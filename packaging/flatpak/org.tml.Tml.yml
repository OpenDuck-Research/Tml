app-id: org.tml.Tml
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk

command: tml

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-data/applications:create

modules:
  - name: python3-certifi
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "certifi==2026.7.22" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/0b/a7/71ac2cff56fec219ed242bb11b8efb69fcc4bec75db06fb7bfe35de520e6/certifi-2026.7.22-py3-none-any.whl
        sha256: 62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775

  - name: python3-charset-normalizer
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "charset-normalizer==3.5.1" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/cc/61/d01fc49b8dea277640b55a9e15960dbca9fdc8c9fde18e572d39c59f4019/charset_normalizer-3.5.1-py3-none-any.whl
        sha256: 6df0ec430f9a831772c23ca5a224cba36517a58a84bb32c32bb59a9fa67c47f6

  - name: python3-idna
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "idna==3.20" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c

  - name: python3-urllib3
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "urllib3==2.8.0" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/92/9d/c4e665119135114480843e7ab388fa94d8480650450e6f8e26b70d323a4c/urllib3-2.8.0-py3-none-any.whl
        sha256: 0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3

  - name: python3-requests
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} "requests==2.34.2" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0

  - name: tml
    buildsystem: simple
    build-commands:
      - python3 -m pip install --prefix=/app --no-deps --no-build-isolation .
      - install -Dm644 packaging/org.tml.Tml.desktop /app/share/applications/org.tml.Tml.desktop
      - install -Dm644 packaging/flatpak/org.tml.Tml.metainfo.xml /app/share/metainfo/org.tml.Tml.metainfo.xml
      - install -Dm644 tml/data/icons/org.tml.Tml.svg /app/share/icons/hicolor/scalable/apps/org.tml.Tml.svg
      - install -Dm644 tml/data/icons/org.tml.Tml-symbolic.svg /app/share/icons/hicolor/symbolic/apps/org.tml.Tml-symbolic.svg
    sources:
      - type: git
        url: https://github.com/Security-Research-Project/Tml.git
        branch: main
